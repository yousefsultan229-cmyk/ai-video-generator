<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator - صانع الفيديوهات بالذكاء الاصطناعي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); border: 1px solid #334155; }
        h1 { text-align: center; margin-bottom: 10px; color: #38bdf8; font-size: 24px; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .upload-section { border: 2px dashed #475569; border-radius: 12px; padding: 25px; text-align: center; cursor: pointer; transition: 0.3s; margin-bottom: 20px; background-color: #0f172a; }
        .upload-section:hover { border-color: #38bdf8; }
        .upload-section input { display: none; }
        .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 15px; }
        .preview-grid img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #38bdf8; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #cbd5e1; }
        textarea { width: 100%; height: 100px; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; resize: none; outline: none; }
        textarea:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #0284c7, #2563eb); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; }
        .result-section { margin-top: 25px; display: none; text-align: center; }
        video { width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid #334155; }
        .loading { display: none; text-align: center; margin-top: 15px; color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎬 صانع الفيديوهات بالذكاء الاصطناعي</h1>
    <p class="subtitle">ارفع صورك، اكتب حركة البرومبت، واحصل على فيديو سينمائي</p>

    <div class="upload-section" onclick="document.getElementById('fileInput').click()">
        <p id="uploadText">📁 اضغط هنا لرفع الصور (يمكنك تحديد أكثر من صورة)</p>
        <input type="file" id="fileInput" accept="image/*" multiple onchange="previewImages(event)">
        <div id="imagePreviewContainer" class="preview-grid"></div>
    </div>

    <div class="input-group">
        <label for="prompt">الوصف (Prompt):</label>
        <textarea id="prompt" placeholder="مثال: دمج الصور وتحريك الشخصية لتلتفت نحو الكاميرا وتبتسم..."></textarea>
    </div>

    <button onclick="generateVideo()">✨ إنتاج الفيديو الآن</button>

    <div id="loading" class="loading">
        ⏳ جاري معالجة الصور وإنشاء الفيديو عبر الذكاء الاصطناعي...
    </div>

    <div id="result" class="result-section">
        <h3>🎉 تم إنشاء الفيديو بنجاح:</h3>
        <video id="videoPlayer" controls autoplay loop>
            <source src="" type="video/mp4">
        </video>
    </div>
</div>

<script>
    function previewImages(event) {
        const files = event.target.files;
        const container = document.getElementById('imagePreviewContainer');
        container.innerHTML = '';

        if (files.length > 0) {
            document.getElementById('uploadText').innerText = `تم اختيار ${files.length} صور (اضغط لتغييرها)`;
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    container.appendChild(img);
                }
                reader.readAsDataURL(file);
            });
        }
    }

    function generateVideo() {
        const prompt = document.getElementById('prompt').value;
        const fileInput = document.getElementById('fileInput');

        if (fileInput.files.length === 0) {
            alert('يرجى رفع صورة واحدة على الأقل!');
            return;
        }
        if (!prompt.trim()) {
            alert('يرجى كتابة البرومبت (وصف الحركة)!');
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('result').style.display = 'none';

        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            document.getElementById('videoPlayer').src = "https://www.w3schools.com/html/mov_bbb.mp4";
        }, 3000);
    }
</script>

</body>
</html>
